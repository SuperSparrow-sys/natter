[project]
name = "natter"
version = "0.1.0"
description = "Lazarus-artige IDE für Python – Umstieg von Pascal/Lazarus auf Python"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "pyside6>=6.8",
    "jsonschema>=4.23",
    "libcst>=1.4",
    "debugpy>=1.8",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
prototypes = [
    "jedi>=0.19",
    "pandas>=2.2",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcl", "ide"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
