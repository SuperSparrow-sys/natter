name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt-Systembibliotheken installieren (headless, für PySide6 offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: uv installieren
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Python 3.13 einrichten
        run: uv python install 3.13

      - name: Abhängigkeiten installieren
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
